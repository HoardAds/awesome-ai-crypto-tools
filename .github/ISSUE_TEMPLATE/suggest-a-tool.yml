name: Suggest a tool
description: Suggest an AI or crypto tool to add to the list
title: "[Suggest] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please link the tool's **official website** only — affiliate, tracking and shortened links are removed.
  - type: input
    id: tool-name
    attributes:
      label: Tool name
      placeholder: "e.g. Example AI"
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official website
      placeholder: "https://example.com"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - AI Coding
        - AI Video
        - AI Writing
        - AI Meeting
        - AI Agents
        - Crypto
        - VPN & Privacy
        - "New category (explain in the description)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-line description
      description: "One sentence: what the tool does and who it is for."
      placeholder: "An AI tool that …"
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Is it free?
      options:
        - Free
        - Freemium (free tier available)
        - Paid only
        - Free trial only
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "This is the tool's official website — not an affiliate, tracking or shortened link"
          required: true
        - label: "The tool is live today and is not already on the list"
          required: true
